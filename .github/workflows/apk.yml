name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Solo documentazione: nessuna compilazione e nessuna nuova release
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Ricrea il keystore dai GitHub Secrets
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      # Compila APK Release firmato
      - name: Build signed APK
        run: |
          gradle assembleRelease --no-daemon \
            -Pvc=${{ github.run_number }} \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release-key.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # Salva l'APK generato
      - uses: actions/upload-artifact@v4
        with:
          name: Timercent-apk
          path: app/build/outputs/apk/release/*.apk

      # APK scaricabile direttamente (senza zip) dalla sezione Releases
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Numero di versione leggibile: scritto a mano in app/build.gradle.kts (versionName)
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release create "v${{ github.run_number }}" app/build/outputs/apk/release/*.apk \
            --title "Timercent $VER (build ${{ github.run_number }})" \
            --notes "Versione $VER, build ${{ github.run_number }}. Build automatica"
